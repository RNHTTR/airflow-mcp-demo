services:
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: airflow-mcp:local
    stdin_open: true
    tty: true
    environment:
      AIRFLOW_BASE_URL: http://host.docker.internal:8080/api/v2
    volumes:
      - ./mcp/app:/srv/mcp/app:ro
      - ./tools:/srv/tools:ro
      - ./resources:/srv/resources:ro
      - ./manifest.json:/srv/manifest.json:ro
  postgres:
    volumes:
      - ./include/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - mbdata:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airflow

volumes:
  mbdata:
